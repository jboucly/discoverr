name: pickarr image

# Builds the pickarr image (https://gitlab.com/dhmetha/pickarr) and publishes it privately to
# ghcr.io/<owner>/pickarr. Manual trigger only: Actions → pickarr image → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: pickarr branch, tag or commit to build
        default: main
        required: true
      platforms:
        description: Image architectures
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

env:
  PICKARR_REPO: https://gitlab.com/dhmetha/pickarr.git
  IMAGE: ghcr.io/${{ github.repository_owner }}/pickarr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone pickarr
        id: src
        env:
          REF: ${{ inputs.ref }}
        run: |
          git clone --quiet "$PICKARR_REPO" pickarr
          git -C pickarr checkout --quiet "$REF"
          echo "sha=$(git -C pickarr rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: inputs.platforms != 'linux/amd64'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: pickarr
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.src.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://gitlab.com/dhmetha/pickarr
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=pickarr
          cache-to: type=gha,scope=pickarr,mode=max

      - name: Summary
        run: |
          echo "Published image: \`$IMAGE:${{ steps.src.outputs.sha }}\` (and \`latest\`), pickarr @ \`${{ inputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
