# Exemple de déploiement : discoverr + une instance pickarr dédiée aux découvertes.
# Prérequis : Plex (ici sur l'hôte, en network_mode host) et slskd si tu veux du FLAC via Soulseek.
# Copie .env.example en .env, remplis-le, puis : docker compose -f docker-compose.example.yml up -d

services:
  # pickarr n'écrit que dans un seul dossier : cette instance est réservée aux découvertes,
  # pour que discoverr ne puisse jamais supprimer autre chose que ce qu'elle a téléchargé.
  pickarr-discovery:
    image: registry.gitlab.com/dhmetha/pickarr:unetha
    container_name: pickarr-discovery
    user: "1000:1000"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - TZ=Europe/Paris
      - Pickarr__Password=${PICKARR_PASSWORD}
      - Pickarr__ApiKey=${DISCOVERY_PICKARR_API_KEY}
      # Facultatif : Soulseek (FLAC). Sans slskd, pickarr se rabat sur YouTube / SoundCloud.
      - Pickarr__Soulseek__Url=${SLSKD_URL:-}
      - Pickarr__Soulseek__ApiKey=${SLSKD_API_KEY:-}
      - Pickarr__Soulseek__DownloadsPath=/soulseek
      - Pickarr__Plex__Url=http://host.docker.internal:32400
      - Pickarr__Plex__Token=${PLEX_TOKEN}
      # Le dossier des découvertes tel que Plex le voit
      - Pickarr__Plex__LibraryPathInPlex=${PLEX_MUSIC_ROOT:-/media/Musiques}/Decouvertes
      - Pickarr__LastFm__ApiKey=${LASTFM_API_KEY}
    volumes:
      - ${APPDATA:-./appdata}/pickarr-discovery:/data
      - ${MUSIC_DIR}/Decouvertes:/music
      - ${SOULSEEK_DOWNLOADS:-./appdata/soulseek}:/soulseek
    restart: unless-stopped

  discoverr:
    image: ghcr.io/jboucly/discoverr:latest
    container_name: discoverr
    user: "1000:1000"
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8091:3000
    # Secrets, URLs et chemins uniquement : le reste se règle dans l'interface.
    environment:
      - TZ=Europe/Paris
      - DISCOVERR_PASSWORD=${DISCOVERR_PASSWORD}
      - DISCOVERR_API_KEY=${DISCOVERR_API_KEY:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - PICKARR_URL=http://pickarr-discovery:8080
      - PICKARR_API_KEY=${DISCOVERY_PICKARR_API_KEY}
      - PICKARR_LIBRARY_SUBDIR=Decouvertes
      - PLEX_URL=http://host.docker.internal:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MUSIC_ROOT=/music
      - PLEX_MUSIC_ROOT=${PLEX_MUSIC_ROOT:-/media/Musiques}
      - DISCOVERY_SUBDIR=Decouvertes
      # Premier démarrage seulement
      - LASTFM_USER=${LASTFM_USER}
      - DRY_RUN=${DISCOVERR_DRY_RUN:-true}
    volumes:
      - ${APPDATA:-./appdata}/discoverr:/data
      - ${MUSIC_DIR}:/music
    depends_on:
      - pickarr-discovery
    restart: unless-stopped
